<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchman Scanner - Gate Pass</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --bg-light: #f8fafc;
            --bg-white: #ffffff;
            --text-dark: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            min-height: 100vh;
            color: var(--text-dark);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--primary);
        }

        header p {
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .card {
            background: var(--bg-white);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.08);
            border: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--bg-white);
            color: var(--text-dark);
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            padding: 8px 16px;
            width: auto;
            font-size: 0.85rem;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-white);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .role-badge {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .alert {
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            text-align: center;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .hidden {
            display: none !important;
        }

        #qr-reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        #qr-reader video {
            border-radius: 12px;
        }

        .scanner-status {
            text-align: center;
            padding: 16px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .exit-result {
            text-align: center;
            padding: 30px;
        }

        .exit-result.success {
            color: var(--success);
        }

        .exit-result.error {
            color: var(--danger);
        }

        .exit-result h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }

        .divider span {
            padding: 0 10px;
        }

        h2 {
            color: var(--primary);
            margin-bottom: 16px;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>🛡️ Watchman Scanner</h1>
            <p>Scan QR codes to process student exits</p>
        </header>

        <!-- Login Section -->
        <section id="loginSection" class="card">
            <h2>🔐 Watchman Login</h2>
            <div id="loginError" class="alert alert-error hidden"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="watchman@college.edu" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-primary" id="loginBtn">Login</button>
            </form>
        </section>

        <!-- Scanner Section -->
        <section id="scannerSection" class="hidden">
            <div class="user-bar">
                <div>Welcome! <span class="role-badge">Watchman</span></div>
                <button class="btn-danger" onclick="logout()">Logout</button>
            </div>

            <div class="card">
                <h2>📷 Scan QR Code</h2>
                <div id="scannerMessage"></div>
                <div id="qr-reader"></div>
                <p class="scanner-status" id="scannerStatus">Point camera at student's QR code</p>

                <div class="divider"><span>OR</span></div>

                <h3 style="font-size: 1rem; margin-bottom: 12px; color: var(--text-secondary);">Manual Entry</h3>
                <div class="form-group">
                    <input type="text" id="manualToken" placeholder="Enter QR token manually">
                </div>
                <button class="btn btn-success" onclick="processManualExit()">Process Exit</button>
            </div>
        </section>
    </div>

    <script>
        const API_BASE = '/api';
        let authToken = localStorage.getItem('watchman_token');
        let html5QrcodeScanner = null;

        if (authToken) showScanner();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('loginError');

            errorDiv.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Logging in...';

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Login failed');

                const payload = JSON.parse(atob(data.token.split('.')[1]));
                if (payload.role !== 'watchman') throw new Error('Access denied - Watchman account required');

                localStorage.setItem('watchman_token', data.token);
                authToken = data.token;
                showScanner();
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        });

        function showScanner() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('scannerSection').classList.remove('hidden');
            initQRScanner();
        }

        function initQRScanner() {
            html5QrcodeScanner = new Html5Qrcode("qr-reader");
            html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess,
                () => { }
            ).catch(err => {
                document.getElementById('scannerStatus').textContent = 'Camera not available. Use manual entry.';
            });
        }

        async function onScanSuccess(qrToken) {
            html5QrcodeScanner.pause();
            document.getElementById('scannerStatus').textContent = 'Processing...';
            await processExit(qrToken);
        }

        async function processExit(qrToken) {
            const msgDiv = document.getElementById('scannerMessage');
            try {
                const res = await fetch(`${API_BASE}/gatepass/exit`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ qr_token: qrToken })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.message || 'Exit failed');

                msgDiv.innerHTML = `
          <div class="exit-result success">
            <h3>✅ Success!</h3>
            <p>Student exited successfully</p>
          </div>
        `;
            } catch (err) {
                msgDiv.innerHTML = `
          <div class="exit-result error">
            <h3>❌ Failed</h3>
            <p>${err.message}</p>
          </div>
        `;
            }

            setTimeout(() => {
                msgDiv.innerHTML = '';
                document.getElementById('scannerStatus').textContent = 'Point camera at student\'s QR code';
                if (html5QrcodeScanner) html5QrcodeScanner.resume();
            }, 3000);
        }

        async function processManualExit() {
            const token = document.getElementById('manualToken').value.trim();
            if (!token) {
                alert('Please enter a QR token');
                return;
            }
            await processExit(token);
            document.getElementById('manualToken').value = '';
        }

        function logout() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().catch(() => { });
            }
            localStorage.removeItem('watchman_token');
            location.reload();
        }
    </script>
</body>

</html>
